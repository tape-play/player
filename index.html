<script>
function getKnobAngle(element, point, startAngle, endAngle, min, max, step) {
    //const element = document.getElementById(elementId);
    //if (!element) {
    //    console.error("Element not found:", elementId);
    //    return null;
    //}

    const rect = element.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const vectorX = point.x - centerX;
    const vectorY = point.y - centerY;
    //const vector2X = point2.x - centerX;
    //const vector2Y = point2.y - centerY;

    const angleRadians = Math.atan2(vectorY, vectorX);
    const startRadians = (startAngle+45) * (Math.PI/180); //idk why should I add 45deg, but without 45deg it doesnt work

    let angleBetweenPointsRadians = angleRadians - startRadians;

    // Normalize to -PI to PI
    if (angleBetweenPointsRadians > Math.PI) {
      angleBetweenPointsRadians -= 2 * Math.PI;
    } else if (angleBetweenPointsRadians < -Math.PI) {
      angleBetweenPointsRadians += 2 * Math.PI;
    }

    const angleBetweenPointsDegrees = angleBetweenPointsRadians * (180 / Math.PI);
    if(endAngle) {
      if(endAngle < angleBetweenPointsDegrees) {
        return {
          radians: endAngle * (Math.PI/180),
          degrees: endAngle,
          value:max
        };
      };
      if(startAngle > angleBetweenPointsDegrees) {
        return {
          radians: startAngle * (Math.PI/180),
          degrees: startAngle,
          value:min
        };
      }
    }
    return {
      radians: angleBetweenPointsRadians,
      degrees: angleBetweenPointsDegrees,
      value: Math.round(((angleBetweenPointsDegrees-startAngle)/(endAngle-startAngle)*(max-min)+min)/step)*step
    };
};

balanceKnob.onwheel = function(e) {

    if(leftGain.gain.value > 0) {

        leftGain.gain.value -= 0.01;
        leftGain.gain.value = Math.round(leftGain.gain.value*100)/100;

        updateTitleBar(`Balance: right: ${Math.round(100-leftGain.gain.value*100)}%`);
      } else if(rightGain.gain.value <= 0.985) {
        rightGain.gain.value += 0.01;

      } else if(rightGain.gain.value > 0.985 && leftGain.gain.value == 1) {
        leftGain.gain.value = rightGain.gain.value = 1;
        balanceKnob.style.transform = 'rotate(0deg)';
        balanceKnob.querySelector('.knob1inside').style.transform = 'rotate(0deg)';
        globalSettings.balance = 0;
        updateTitleBar(`Balance: center`);

    }
  } else if(e.deltaX < 0 || e.deltaY < 0) {
    if(rightGain.gain.value > 0) {
      if(rightGain.gain.value <= 1 && leftGain.gain.value == 1) {
        rightGain.gain.value -= 0.01;
        rightGain.gain.value = Math.round(rightGain.gain.value*100)/100;

        let valueConvertedToAngle = (1-leftGain.gain.value)*135;
        balanceKnob.style.transform = 'rotate(' +valueConvertedToAngle+'deg)';
        balanceKnob.querySelector('.knob1inside').style.transform = 'rotate(' + (-valueConvertedToAngle)+'deg)';
        globalSettings.balance = -Math.round(1-rightGain.gain.value*100)/100;
        updateTitleBar(`Balance: right: ${Math.round(100-leftGain.gain.value*100)}%`);
      } else if(leftGain.gain.value > 0.985 && rightGain.gain.value == 1) {

        balanceKnob.querySelector('.knob1inside').style.transform = 'rotate(0deg)';

};

function getInfiniteKnobAngle(element, point, max, angle, step) {
    //const element = document.getElementById(elementId);
    //if (!element) {
    //    console.error("Element not found:", elementId);
    //    return null;
    //}

    const rect = element.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const vectorX = point.x - centerX;
    const vectorY = point.y - centerY;
    //const vector2X = point2.x - centerX;
    //const vector2Y = point2.y - centerY;

    const angleRadians = Math.atan2(vectorY, vectorX);
    const startRadians = (angle) * (Math.PI/180); 

    let angleBetweenPointsRadians = angleRadians - startRadians;
/*     if(angleBetweenPointsRadians < 0) {
      angleBetweenPointsRadians += 90*(Math.PI/180);
    }; */
    // Normalize to -PI to PI
    if (angleBetweenPointsRadians > Math.PI) {
      angleBetweenPointsRadians -= 2 * Math.PI;
    } else if (angleBetweenPointsRadians < -Math.PI) {
      angleBetweenPointsRadians += 2 * Math.PI;
    }

    const angleBetweenPointsDegrees = angleBetweenPointsRadians * (180 / Math.PI);
/*     if(endAngle) {
      if(endAngle < angleBetweenPointsDegrees) {
        return {
          radians: endAngle * (Math.PI/180),
          degrees: endAngle,
          value:max
        };
      };
      if(startAngle > angleBetweenPointsDegrees) {
        return {
          radians: startAngle * (Math.PI/180),
          degrees: startAngle,
          value:min
        };
      }
    } */
    return {
      radians: angleBetweenPointsRadians,
      degrees: angleBetweenPointsDegrees,
      value: Math.floor(Math.abs(angleBetweenPointsDegrees/360*max)/step)*step*(angleBetweenPointsDegrees < 0 ? -1 : 1)
    };
}

function disconnectEffects() {

try{sourceGain.disconnect(customSoundEffect)}catch(e){}
try{sourceGain.disconnect(preamp)}catch(e){}
try{sourceGain.disconnect(compressor)}catch(e){}
try{sourceGain.disconnect(delaySplitter)}catch(e){}
try{sourceGain.disconnect(monoChannelSplitter)}catch(e){}
try{sourceGain.disconnect(inputLevelGain)}catch(e){}

try{customSoundEffect.disconnect(preamp)}catch(e){}
try{customSoundEffect.disconnect(compressor)}catch(e){}
try{customSoundEffect.disconnect(delaySplitter)}catch(e){}
try{customSoundEffect.disconnect(monoChannelSplitter)}catch(e){}
try{customSoundEffect.disconnect(inputLevelGain)}catch(e){}

try{filters[filters.length-1].disconnect(compressor)}catch(e){}
try{filters[filters.length-1].disconnect(delaySplitter)}catch(e){}
try{filters[filters.length-1].disconnect(monoChannelSplitter)}catch(e){}
try{filters[filters.length-1].disconnect(inputLevelGain)}catch(e){}

try{compressor.disconnect(delaySplitter)}catch(e){}
try{compressor.disconnect(monoChannelSplitter)}catch(e){}
try{compressor.disconnect(inputLevelGain)}catch(e){}

try{delayMerger.disconnect(monoChannelSplitter)}catch(e){}
try{delayMerger.disconnect(inputLevelGain)}catch(e){}

try{monoChannelMerger.disconnect(inputLevelGain)}catch(e){}

}



function connectEffects() {

try{
sourceGain.connect(
globalSettings.customSoundEffectOn ? customSoundEffect :
(globalSettings.equalizerOn ? preamp :
(globalSettings.compressorOn ? compressor :
(globalSettings.stereoEnhancerOn ? delaySplitter :
(globalSettings.enableMonoMode ? monoChannelSplitter : inputLevelGain)))));
}catch(e){document.write(e)}

try{
(globalSettings.customSoundEffectOn ? customSoundEffect : sourceGain).connect(
globalSettings.equalizerOn ? preamp :
(globalSettings.compressorOn ? compressor :
(globalSettings.stereoEnhancerOn ? delaySplitter :
(globalSettings.enableMonoMode ? monoChannelSplitter : inputLevelGain))));
}catch(e){document.write(e)}

try{
(globalSettings.equalizerOn ? filters[filters.length-1] :
(globalSettings.customSoundEffectOn ? customSoundEffect : sourceGain)).connect(
globalSettings.compressorOn ? compressor :
(globalSettings.stereoEnhancerOn ? delaySplitter :
(globalSettings.enableMonoMode ? monoChannelSplitter : inputLevelGain)));
}catch(e){document.write(e)}

try{
(globalSettings.compressorOn ? compressor :
(globalSettings.equalizerOn ? filters[filters.length-1] :
(globalSettings.customSoundEffectOn ? customSoundEffect : sourceGain))).connect(
globalSettings.stereoEnhancerOn ? delaySplitter :
(globalSettings.enableMonoMode ? monoChannelSplitter : inputLevelGain));
}catch(e){document.write(e)}

try{
(globalSettings.stereoEnhancerOn ? delayMerger :
(globalSettings.compressorOn ? compressor :
(globalSettings.equalizerOn ? filters[filters.length-1] :
(globalSettings.customSoundEffectOn ? customSoundEffect : sourceGain)))).connect(
globalSettings.enableMonoMode ? monoChannelSplitter : inputLevelGain);
}catch(e){document.write(e)}

try{
(globalSettings.enableMonoMode ? monoChannelMerger :
(globalSettings.stereoEnhancerOn ? delaySplitter :
(globalSettings.compressorOn ? compressor :
(globalSettings.equalizerOn ? filters[filters.length-1] :
(globalSettings.customSoundEffectOn ? customSoundEffect : sourceGain))))).connect(inputLevelGain);
}catch(e){document.write(e)}

}

function reconnectEffects() {
  disconnectEffects();
  connectEffects();
}

        window.onload = (async ()=>{try{
            await context.audioWorklet.addModule('data:text/javascript,'+encodeURI(
`class CustomSoundEffect${customSoundEffectId} extends AudioWorkletProcessor {
${globalSettings.customSoundEffectCode}
}
registerProcessor("CustomSoundEffect${customSoundEffectId}", CustomSoundEffect${customSoundEffectId});`
));
            customSoundEffect = new AudioWorkletNode(context, `CustomSoundEffect${customSoundEffectId}`);
        
connectEffects();
}catch(e){document.write(e)}
});



let delayNodeL = context.createDelay(179);
let delayNodeR = context.createDelay(179);
let delaySplitter = context.createChannelSplitter(2);
let delayMerger = context.createChannelMerger(2);

delayNodeL.delayTime.value = Math.abs(Math.min(0,globalSettings.stereoEnhancerDelay));

function rgbToHsl(r, g, b) {
  r /= 255;
  g /= 255;
  b /= 255;

  let max = Math.max(r, g, b);
  let min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;

  if (max === min) {
    h = s = 0; // achromatic
  } else {
    let d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r:
        h = (g - b) / d + (g < b ? 6 : 0);
        break;
      case g:
        h = (b - r) / d + 2;
        break;
      case b:
        h = (r - g) / d + 4;
        break;
    }
    h /= 6;
  }

  return {
    h: Math.round(h * 360),
    s: Math.round(s * 100),
    l: Math.round(l * 100)
  };
}

async function readID3(file, cyrMode, readAllFile, forceEncoding, is16bitEncoding) { // file - file object with mp3 file, cyrMode - windows-1251 or iso-8859-1 if the string isn't encoded with unicode, readAllFile - try to find as much id3v2 metadata as possible by reading all the file content, forceEncoding - ignore encoding autodetect and decode all tags using this encoding, is16bitEncoding - true if user specified force encoding has 16 bits per symbol (e.g. utf-16)
  return new Promise(function(resolve) {
  let fr = new FileReader();
  fr.readAsArrayBuffer(file);
  fr.onload = function() {
    //let uint8result = new Uint8Array(fr.result);
    dataview = new DataView(fr.result);
    let filebytesize = fr.result.byteLength;
    console.log('file size, bytes: '+filebytesize);
    if(filebytesize < 10) {resolve({})} else {
    let tagstring = String.fromCharCode(dataview.getUint8(0))+String.fromCharCode(dataview.getUint8(1))+String.fromCharCode(dataview.getUint8(2));
    let id3v1tagstring;
    if(filebytesize > 127) {
      id3v1tagstring = String.fromCharCode(dataview.getUint8(filebytesize-128))+String.fromCharCode(dataview.getUint8(filebytesize-127))+String.fromCharCode(dataview.getUint8(filebytesize-126));
    }
    console.log('ID3v2 tag string: '+tagstring);
    console.log('ID3v1 tag string: '+id3v1tagstring);
    if(tagstring == 'ID3') { // mp3 id3v2
      let id3ver = dataview.getUint8(3)
      let id3subver = dataview.getUint8(4);
      console.log('ID3v2.'+id3ver+'.'+id3subver);
 
      let id3flags = dataview.getUint8(5);
      console.log('flags: '+id3flags);
 
      let id3lengths = [dataview.getUint8(6),dataview.getUint8(7),dataview.getUint8(8),dataview.getUint8(9)];
      let id3length_dec = (id3lengths[0] << 21) | (id3lengths[1] << 14) | (id3lengths[2] << 7) | id3lengths[3];
      let id3length_bin = id3length_dec.toString(2);
      console.log('ID3v2 length: bin: '+id3length_bin+',dec: '+id3length_dec);
 
      let id3bytepointer = 10;
 
      let id3v2json = {ver:[2,id3ver,id3subver]};
 
      while(id3bytepointer < (readAllFile ? filebytesize-4 : id3length_dec+10)) {
/*       if(id3bytepointer >= filebytesize-1) {
        break;
      } */
        //let id3currentbyte = dataview.getUint8(id3bytepointer);
        let id3current4bytes = String.fromCharCode(dataview.getUint8(id3bytepointer))+String.fromCharCode(dataview.getUint8(id3bytepointer+1))+String.fromCharCode(dataview.getUint8(id3bytepointer+2))+String.fromCharCode(dataview.getUint8(id3bytepointer+3));
 
        if(id3tagmarkers[id3current4bytes]) {
          id3bytepointer += 4;
          let id3framelength = dataview.getUint32(id3bytepointer);
          console.log('current frame: '+id3current4bytes);
          console.log('frame length: '+id3framelength);
          id3bytepointer += 8;
          let id3currenttagvalues = {};
          if(dataview.getUint8(id3bytepointer-2) < 4) { // encoding check
            id3currenttagvalues = {encoding: dataview.getUint8(id3bytepointer-2), value: [], length: id3framelength-2};
            id3bytepointer++;
            if(id3current4bytes == 'APIC') {
              id3bytepointer -= 3;
              let id3apicframestart = id3bytepointer;
              id3currenttagvalues.encoding = dataview.getUint8(id3bytepointer);
              id3bytepointer++;
              let id3picmimetype = '';
              while ((id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2 || (is16bitEncoding && forceEncoding)) ? dataview.getUint16(id3bytepointer) : dataview.getUint8(id3bytepointer) != 0) {
                id3picmimetype += String.fromCharCode(dataview.getUint8(id3bytepointer));//.replace('\x00','');
                id3bytepointer++;
              };
              id3bytepointer++;
              let id3pictype = dataview.getUint8(id3bytepointer);
              id3bytepointer++;
              let id3picdescription = [];
              while (dataview.getUint8(id3bytepointer) != 0) {
                id3picdescription.push((id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2 || (is16bitEncoding && forceEncoding)) ? dataview.getUint16(id3bytepointer) : dataview.getUint8(id3bytepointer));
                id3bytepointer+=(id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2) ? 2 : 1;
              };
              id3bytepointer++;
              let id3picbinary = [];
              while(id3bytepointer - id3apicframestart < id3framelength) {
                id3picbinary.push(dataview.getUint8(id3bytepointer));
                id3bytepointer++;
              };
              id3currenttagvalues.mimeType = id3picmimetype;
              id3currenttagvalues.type = id3pictype;
              id3currenttagvalues.description = id3picdescription;
              id3currenttagvalues.value = id3picbinary;
            } else if(id3current4bytes == 'COMM' || id3current4bytes == 'TXXX') {
              id3bytepointer -= 3;
              let id3commframestart = id3bytepointer;
              id3currenttagvalues.encoding = dataview.getUint8(id3bytepointer);
              id3bytepointer++;
              id3currenttagvalues.lang = [dataview.getUint8(id3bytepointer),dataview.getUint8(id3bytepointer+1),dataview.getUint8(id3bytepointer+2)];
              id3bytepointer+=3;
              id3currenttagvalues.description = [];
              while (dataview.getUint8(id3bytepointer) != 0) {
                id3currenttagvalues.description.push(dataview.getUint8(id3bytepointer));
                id3bytepointer+=(id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2) ? 2 : 1;
              };
              id3bytepointer-=0;
              id3currenttagvalues.value = [];
              for (let i = 1; i < (id3framelength)/((id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2)?2:1)-id3currenttagvalues.description.length-1; i++) {
                if(id3bytepointer < filebytesize) {
                  let id3currenttagvaluebyte = (id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2 || (is16bitEncoding && forceEncoding)) ? dataview.getUint16(id3bytepointer) : dataview.getUint8(id3bytepointer);
                  id3currenttagvalues.value.push(id3currenttagvaluebyte);
                  id3bytepointer+=(id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2) ? 2 : 1;
                } else {
                  break;
                  id3bytepointer-=1;
                }
              };
            } else if(id3current4bytes == 'USLT') {
              id3bytepointer-=4;
              for (let i = 1; i < (id3framelength)/((id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2)?2:1); i++) {
                let id3currenttagvaluebyte = (id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2 || (is16bitEncoding && forceEncoding)) ? dataview.getUint16(id3bytepointer) : dataview.getUint8(id3bytepointer);
                if(id3bytepointer < filebytesize && id3currenttagvaluebyte != 0) {
                  id3currenttagvalues.value.push(id3currenttagvaluebyte);
                  id3bytepointer+=(id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2) ? 2 : 1;
                } else {
                  break;
                  id3bytepointer-=1;
                }
              };
            } else {
              id3bytepointer-=2;
              for (let i = 1; i < (id3framelength)/((id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2)?2:1); i++) {
                let id3currenttagvaluebyte = (id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2 || (is16bitEncoding && forceEncoding)) ? dataview.getUint16(id3bytepointer) : dataview.getUint8(id3bytepointer);
                if(id3bytepointer < filebytesize && id3currenttagvaluebyte != 0) {
                  id3currenttagvalues.value.push(id3currenttagvaluebyte);
                  id3bytepointer+=(id3currenttagvalues.encoding == 1 || id3currenttagvalues.encoding == 2) ? 2 : 1;
                } else {
                  break;
                  id3bytepointer-=1;
                }
              };
            };
            if(!id3v2json[id3current4bytes]) {
              id3v2json[id3current4bytes] = id3currenttagvalues;
            } else {
              if(!id3v2json[id3current4bytes].otherValues) {
                id3v2json[id3current4bytes].otherValues = [id3currenttagvalues];
              } else {
                id3v2json[id3current4bytes].otherValues.push(id3currenttagvalues);
              };
            };
            id3bytepointer-=8;
          };
          };
          id3bytepointer++;
        };
        for (let id3frame in id3v2json) {
          if(id3frame == 'APIC') {
            let id3frameencoding = id3v2json[id3frame].encoding == 0 ? (cyrMode ? 'windows-1251' : 'ISO-8859-1') :
                                  (id3v2json[id3frame].encoding == 1 ? 'utf-16be' :
                                  (id3v2json[id3frame].encoding == 2 ? 'UTF-16be' : 'UTF-8'));
            let id3frameDecoder = new TextDecoder(forceEncoding ? forceEncoding : id3frameencoding, (!forceEncoding && id3v2json[id3frame].encoding == 2) ? {ignoreBOM: true} : {ignoreBOM: false});
            id3v2json[id3frame].description = id3frameDecoder.decode(new Uint8Array(id3v2json[id3frame].description));//.replaceAll('\x00','');
          } else {
            let id3frameencoding = id3v2json[id3frame].encoding == 0 ? (cyrMode ? 'windows-1251' : 'ISO-8859-1') :
                                  (id3v2json[id3frame].encoding == 1 ? 'utf-16be' :
                                  (id3v2json[id3frame].encoding == 2 ? 'UTF-16be' : 'UTF-8'));
            let id3frameDecoder = new TextDecoder(forceEncoding ? forceEncoding : id3frameencoding, (!forceEncoding && id3v2json[id3frame].encoding == 2) ? {ignoreBOM: true} : {ignoreBOM: false});
            id3v2json[id3frame].value = id3frameDecoder.decode(new Uint16Array(id3v2json[id3frame].value)).replaceAll('\x00','');
          }
        };
        resolve(id3v2json);
         
      } else if(id3v1tagstring == 'TAG') { // mp3 id3v1
        let id3v1json = {ver:[1]};
        id3bytepointer = filebytesize-125;

        let id3songname = [];
        let id3artist = [];
        let id3album = [];
        let id3year = [];
        let id3comment = [];
        let id3tracknumber = null;
        let id3genre = null;

        for (let i = 0; i < 30 / ((is16bitEncoding && forceEncoding) ? 2 : 1); i++) {
          id3songname.push((is16bitEncoding && forceEncoding) ? dataview.getUint16(id3bytepointer) : dataview.getUint8(id3bytepointer));
          id3bytepointer+=(is16bitEncoding && forceEncoding) ? 2 : 1;
        };
        for (let i = 0; i < 30 / ((is16bitEncoding && forceEncoding) ? 2 : 1); i++) {
          id3artist.push((is16bitEncoding && forceEncoding) ? dataview.getUint16(id3bytepointer) : dataview.getUint8(id3bytepointer));
          id3bytepointer+=(is16bitEncoding && forceEncoding) ? 2 : 1;
        };
        for (let i = 0; i < 30 / ((is16bitEncoding && forceEncoding) ? 2 : 1); i++) {
          id3album.push((is16bitEncoding && forceEncoding) ? dataview.getUint16(id3bytepointer) : dataview.getUint8(id3bytepointer));
          id3bytepointer+=(is16bitEncoding && forceEncoding) ? 2 : 1;
        };
        for (let i = 0; i < 4; i++) {
          id3year.push(dataview.getUint8(id3bytepointer));
          id3bytepointer++;
        };
        for (let i = 0; i < 28 / ((is16bitEncoding && forceEncoding) ? 2 : 1); i++) {
          id3comment.push((is16bitEncoding && forceEncoding) ? dataview.getUint16(id3bytepointer) : dataview.getUint8(id3bytepointer));
          id3bytepointer+=(is16bitEncoding && forceEncoding) ? 2 : 1;
        };
        if(dataview.getUint8(id3bytepointer) == 0) {
          id3bytepointer++;
          id3tracknumber = dataview.getUint8(id3bytepointer);
        } else {
          id3comment += (is16bitEncoding && forceEncoding) ? dataview.getUint16(id3bytepointer) : dataview.getUint8(id3bytepointer);
          id3bytepointer+=(is16bitEncoding && forceEncoding) ? 2 : 1;
          id3comment += (is16bitEncoding && forceEncoding) ? dataview.getUint16(id3bytepointer) : dataview.getUint8(id3bytepointer);
        };
        id3bytepointer++;
        id3genre = dataview.getUint8(id3bytepointer);
 
        let id3v1decoder = new TextDecoder(forceEncoding ? forceEncoding : (cyrMode ? 'windows-1251' : 'ISO-8859-1'));//ISO-8859-1, windows-1251
   
        id3v1json['TPE1'] = {encoding:0, value: id3v1decoder.decode(new Uint16Array(id3artist)).replaceAll('\x00','')};
        id3v1json['TIT2'] = {encoding:0, value: id3v1decoder.decode(new Uint16Array(id3songname)).replaceAll('\x00','')};
        id3v1json['TALB'] = {encoding:0, value: id3v1decoder.decode(new Uint16Array(id3album)).replaceAll('\x00','')};
        id3v1json['COMM'] = {encoding:0, value: id3v1decoder.decode(new Uint16Array(id3comment)).replaceAll('\x00','')};
       
        console.log(id3v1json);

        resolve(id3v1json);
 
      } else {
        resolve({});
      }
    }
    }
  });
};

async function readFLACOggMetadata(file) {
  return new Promise(function(resolve) {
    let fr = new FileReader();
    fr.readAsArrayBuffer(file);
    fr.onload = function() {
      let dataview = new DataView(fr.result);
      let filebytesize = fr.result.byteLength;
      if(filebytesize < 4) return resolve({});
      
      try {
        let magic = String.fromCharCode(dataview.getUint8(0), dataview.getUint8(1), dataview.getUint8(2), dataview.getUint8(3));
        let vc_json = {};
        let vc_decoder = new TextDecoder('utf-8');

        function parseVorbisComment(dv, ptr, length, targetObj) {
            let vc_vendorStringLength = dv.getUint32(ptr, true);
            ptr+=4;
            ptr += vc_vendorStringLength; // skip vendor string
            
            let vc_fieldsAmount = dv.getUint32(ptr, true);
            ptr+=4;
            for (let i = 0; i < vc_fieldsAmount; i++) {
                let vc_currentFieldLength = dv.getUint32(ptr, true);
                ptr+=4;
                let vc_currentFieldName = [];
                while (dv.getUint8(ptr, true) != 61) { // '='
                  vc_currentFieldName.push(dv.getUint8(ptr, true));
                  ptr++;
                };
                vc_currentFieldLength -= vc_currentFieldName.length + 1;
                ptr++; // skip '=' sign
                let vc_currentFieldValue = [];
                for (let j = 0; j < vc_currentFieldLength; j++) {
                  vc_currentFieldValue.push(dv.getUint8(ptr, true));
                  ptr++;
                };
                let vc_fieldNameString = vc_decoder.decode(new Uint8Array(vc_currentFieldName)).toLowerCase();
                
                if (vc_fieldNameString === 'metadata_block_picture') {
                   try {
                     let b64 = vc_decoder.decode(new Uint8Array(vc_currentFieldValue));
                     let rawBinary = atob(b64);
                     let picDataView = new DataView(new ArrayBuffer(rawBinary.length));
                     for(let b=0; b<rawBinary.length; b++) picDataView.setUint8(b, rawBinary.charCodeAt(b));
                     
                     let picType = picDataView.getUint32(0);
                     let mimeLen = picDataView.getUint32(4);
                     let mimeStr = "";
                     let picPos = 8;
                     for(let m=0; m<mimeLen; m++) mimeStr += String.fromCharCode(picDataView.getUint8(picPos++));
                     let descLen = picDataView.getUint32(picPos);
                     picPos += 4 + descLen + 16;
                     let picDataLen = picDataView.getUint32(picPos);
                     picPos += 4;
                     let picBytes = [];
                     for(let b=0; b<picDataLen; b++) picBytes.push(picDataView.getUint8(picPos++));
                     
                     targetObj['APIC'] = {mimeType: mimeStr, type: picType, value: picBytes};
                   } catch(e) { console.error("Error decoding base64 picture", e); }
                } else {
                   targetObj[vc_fieldNameString] = targetObj[vc_fieldNameString]||[];
                   targetObj[vc_fieldNameString].push(vc_decoder.decode(new Uint8Array(vc_currentFieldValue)));
                }
            }
        }

        if (magic === 'fLaC') {
          let vc_bytePointer = 4;
          let vc_lastMetadata = false;
          while (!vc_lastMetadata && vc_bytePointer < filebytesize) {
            let vc_currentMetadataHeader = ("00000000" + dataview.getUint8(vc_bytePointer).toString(2)).slice(-8);
            let vc_currentMetadataType = parseInt(vc_currentMetadataHeader.slice(1),2);
            vc_lastMetadata = !!Number(vc_currentMetadataHeader[0]);
            vc_bytePointer++;
            let vc_currentMetadataLength = (dataview.getUint8(vc_bytePointer) << 16) | (dataview.getUint8(vc_bytePointer+1) << 8) | dataview.getUint8(vc_bytePointer+2);
            vc_bytePointer+=3;
            let nextBlockPointer = vc_bytePointer + vc_currentMetadataLength;
            
            if(vc_currentMetadataType == 4) {
               parseVorbisComment(dataview, vc_bytePointer, vc_currentMetadataLength, vc_json);
            } else if(vc_currentMetadataType == 6) {
              let picType = dataview.getUint32(vc_bytePointer);
              vc_bytePointer += 4;
              let mimeLen = dataview.getUint32(vc_bytePointer);
              vc_bytePointer += 4;
              let mimeStr = "";
              for(let i=0; i<mimeLen; i++) mimeStr += String.fromCharCode(dataview.getUint8(vc_bytePointer++));
              let descLen = dataview.getUint32(vc_bytePointer);
              vc_bytePointer += 4;
              vc_bytePointer += descLen; 
              vc_bytePointer += 16; 
              let picDataLen = dataview.getUint32(vc_bytePointer);
              vc_bytePointer += 4;
              let picData = [];
              for(let i=0; i<picDataLen; i++) picData.push(dataview.getUint8(vc_bytePointer++));
              vc_json['APIC'] = {mimeType: mimeStr, type: picType, value: picData};
            }
            vc_bytePointer = nextBlockPointer;
          }
          resolve(vc_json);
        } else if (magic === 'OggS') {
          let bytePointer = 0;
          let packets = [];
          let currentPacket = [];
          
          while (bytePointer < filebytesize && packets.length < 2) { 
            if (bytePointer + 27 > filebytesize) break;
            if (dataview.getUint8(bytePointer) === 0x4F && dataview.getUint8(bytePointer+1) === 0x67 && dataview.getUint8(bytePointer+2) === 0x67 && dataview.getUint8(bytePointer+3) === 0x53) {
                let pageSegments = dataview.getUint8(bytePointer + 26);
                let segmentTableOffset = bytePointer + 27;
                let payloadOffset = segmentTableOffset + pageSegments;
                
                for (let i = 0; i < pageSegments; i++) {
                    let segLen = dataview.getUint8(segmentTableOffset + i);
                    for (let j = 0; j < segLen; j++) {
                        if (payloadOffset < filebytesize) {
                           currentPacket.push(dataview.getUint8(payloadOffset++));
                        }
                    }
                    if (segLen < 255) {
                        packets.push(new Uint8Array(currentPacket));
                        currentPacket = [];
                    }
                }
                bytePointer = payloadOffset;
            } else {
                bytePointer++;
            }
          }
          
          for (let p=0; p<packets.length; p++) {
             let pkt = packets[p];
             let magic8 = "";
             for(let i=0; i<8 && i<pkt.length; i++) magic8 += String.fromCharCode(pkt[i]);
             let magic7 = magic8.substring(0, 7);
             let vc_offset = -1;
             
             if (magic8 === 'OpusTags') {
                 vc_offset = 8;
             } else if (magic7 === '\x03vorbis') {
                 vc_offset = 7;
             }
             
             if (vc_offset !== -1) {
                 let pktDV = new DataView(pkt.buffer, pkt.byteOffset, pkt.byteLength);
                 parseVorbisComment(pktDV, vc_offset, pkt.length - vc_offset, vc_json);
                 break;
             }
          }
          resolve(vc_json);
        } else {
          resolve({});
        }
      } catch(err) {
        console.error(err);
        resolve({});
      }
    };
  });
};

async function readMP4Metadata(file) {
  return new Promise(function(resolve) {
    let fr = new FileReader();
    fr.readAsArrayBuffer(file);
    fr.onload = function() {
      let dataview = new DataView(fr.result);
      let filebytesize = fr.result.byteLength;
      let json = {};
      let decoder = new TextDecoder('utf-8');

      function readBox(offset, maxOffset) {
         if (offset + 8 > maxOffset) return null;
         let size = dataview.getUint32(offset);
         let type = String.fromCharCode(dataview.getUint8(offset+4), dataview.getUint8(offset+5), dataview.getUint8(offset+6), dataview.getUint8(offset+7));
         if (size === 0) size = maxOffset - offset;
         if (size === 1) {
            if (offset + 16 > maxOffset) return null;
            size = Number(dataview.getBigUint64(offset + 8)); 
         }
         return { size, type, offset };
      }

      function findBox(type, startOffset, endOffset) {
         let currentOffset = startOffset;
         while (currentOffset < endOffset) {
           let box = readBox(currentOffset, endOffset);
           if (!box) break;
           if (box.type === type) return box;
           currentOffset += box.size;
         }
         return null;
      }

      try {
        let moov = findBox('moov', 0, filebytesize);
        if (!moov) return resolve({});
        let moovDataOffset = moov.offset + 8;
        if (moov.size === 1) moovDataOffset += 8;

        let udta = findBox('udta', moovDataOffset, moov.offset + moov.size);
        if (!udta) return resolve({});
        let udtaDataOffset = udta.offset + 8;
        if (udta.size === 1) udtaDataOffset += 8;

        let meta = findBox('meta', udtaDataOffset, udta.offset + udta.size);
        if (!meta) return resolve({});

        let metaDataOffset = meta.offset + 12; // meta is FullBox, has 4 bytes flags/version

        let ilst = findBox('ilst', metaDataOffset, meta.offset + meta.size);
        if (!ilst) return resolve({});

        let currentOffset = ilst.offset + 8;
        if (ilst.size === 1) currentOffset += 8;
        let endOffset = ilst.offset + ilst.size;

        while (currentOffset < endOffset) {
           let itemBox = readBox(currentOffset, endOffset);
           if (!itemBox) break;
           
           let dataBox = findBox('data', itemBox.offset + 8, itemBox.offset + itemBox.size);
           if (dataBox) {
              let dataType = dataview.getUint32(dataBox.offset + 8);
              let dataLen = dataBox.size - 16;
              let dataOffset = dataBox.offset + 16;
              
              if (dataType === 1) { // text
                 let strArr = [];
                 for (let i = 0; i < dataLen; i++) {
                   strArr.push(dataview.getUint8(dataOffset + i));
                 }
                 let str = decoder.decode(new Uint8Array(strArr));
                 
                 if (itemBox.type === '©nam') json['TIT2'] = { value: str };
                 if (itemBox.type === '©ART') json['TPE1'] = { value: str };
                 if (itemBox.type === '©alb') json['TALB'] = { value: str };
                 if (itemBox.type === '©day') json['TYER'] = { value: str };
                 if (itemBox.type === '©cmt') json['COMM'] = { value: str };
                 if (itemBox.type === 'trkn') json['TRCK'] = { value: str };
              } else if (dataType === 13 || dataType === 14 || dataType === 0) { // JPEG or PNG or binary (implicit fallback)
                 let picData = [];
                 for (let i = 0; i < dataLen; i++) {
                   picData.push(dataview.getUint8(dataOffset + i));
                 }
                 let mimeType = dataType === 13 ? 'image/jpeg' : (dataType === 14 ? 'image/png' : 'image/jpeg');
                 if (itemBox.type === 'covr') {
                   json['APIC'] = { mimeType: mimeType, value: picData };
                 }
              }
           }
           currentOffset += itemBox.size;
        }
        resolve(json);
      } catch(e) {
        console.error(e);
        resolve({});
      }
    };
  });
};


function extractFilename(path) {
  if (path.substr(0, 12) == "C:\\fakepath\\")
    return path.substr(12); // modern browser
  var x;
  x = path.lastIndexOf('/');
  if (x >= 0) // Unix-based path
    return path.substr(x+1);
  x = path.lastIndexOf('\\');
  if (x >= 0) // Windows-based path
    return path.substr(x+1);
  return path; // just the filename
}

    async function GetFileDuration(url) {

      return new Promise(function(resolve) {
      if(/^data:audio\/mid/.test(url)) {//alert();
        let tmpMidResult = MidiParser.parse(url);
        let tmpMidiTempo = 500000;
        let tmpTimeOffset = tmpMidiDuration = 0;
        for (let i = 0; i < tmpMidResult.track.length; i++) {
          let dt = 0;
          for (let j = 0; j < tmpMidResult.track[i].event.length; j++) {
            dt += tmpMidResult.track[i].event[j].deltaTime;
            let tmpTimeOffset = (dt / tmpMidResult.timeDivision) * (tmpMidiTempo / 1000000);
            if (tmpMidResult.track[i].event[j].type === 255 && tmpMidResult.track[i].event[j].metaType === 81) {
              tmpMidiTempo = tmpMidResult.track[i].event[j].data;
              tmpTimeOffset = (dt / tmpMidResult.timeDivision) * (tmpMidiTempo / 1000000);
            }
            if (tmpTimeOffset > tmpMidiDuration) {
              tmpMidiDuration = tmpTimeOffset;
            };
          }
        };
        resolve(tmpMidiDuration); 
      } else {
        tmp_audio.src = url;
        tmp_audio.addEventListener("loadedmetadata", function() {
          if (tmp_audio.duration === Infinity) {
            // Set it to bigger than the actual duration
            tmp_audio.currentTime = 1e101;
            tmp_audio.addEventListener("timeupdate", function() {
              resolve(tmp_audio.duration);
            }, { once: true });
          } else {
            resolve(tmp_audio.duration);
          }
        }, {once:true});
      }

      });
    }

        if(state==1){playAudio(true)};

    function nextTrack(onTrackEnd) {
      if(onTrackEnd) {

          currentTrackIndex = 0;
          loadTrack(currentTrackIndex);
          playAudio(true);

  }
};

function rewindBy(time) {
  if(isMidi) {
    midiCurrentTime = Math.max(0, midiCurrentTime - time);
  } else {
    if(audio.duration, audio.currentTime) {
      audio.currentTime = Math.max(0, audio.currentTime - time);
    }
  }
}
function fastForwardBy(time) {
  if(isMidi) {
    midiCurrentTime = Math.min(midiDuration, midiCurrentTime + time);
  } else {
    if(audio.duration, audio.currentTime) {
      audio.currentTime = Math.min(audio.duration, audio.currentTime + time);
    }
  }
}

let titleBarTimeout;
let titleBarScrollTimeouts = [];
function updateTitleBar(info) {
  const titleEl = document.getElementById('titleBar');
  const track = tracks[currentTrackIndex];
  const name = track ? track.name : "No track";
  titleBarScrollTimeouts.forEach(function(t){clearTimeout(t)});
  if(info) {
    clearTimeout(titleBarTimeout);
    titleEl.innerHTML = `${renderTitleBar(info)}`;
    if(info.length > 26) {
      //titleBarScrollTimeouts.push(setTimeout(function(){
      for (let i = 0; i < info.length-26; i++) {
        titleBarScrollTimeouts.push(setTimeout(function(){titleEl.scrollBy(11,0)}, 125*i+1000));
      }
      titleBarTimeout = setTimeout(function() {
        titleEl.innerHTML = `${renderTitleBar(name)}`;
      }, 3000+125*(info.length-26));//}, 1000));
    } else {
      titleBarTimeout = setTimeout(function() {
        titleEl.innerHTML = `${renderTitleBar(name)}`;
      }, 3000);
    }
  } else {
    if(name.length > 26) {
      titleBarScrollTimeouts.push(setTimeout(function(){
      for (let i = 0; i < name.length-26; i++) {
        titleBarScrollTimeouts.push(setTimeout(function(){titleEl.scrollBy(11,0)}, 125*i+1000));
        titleBarScrollTimeouts.push(setTimeout(function() {
          titleEl.scrollTo(0,0)
        }, 1000+125*(name.length-26)));
      }}, 1000));
      titleEl.innerHTML = `${renderTitleBar(name)}`;
    } else {
      titleEl.innerHTML = `${renderTitleBar(name)}`;
    }
    document.head.querySelector('title').innerHTML = state > 0 ? (track?track.name:"        ㅤ"):"        ㅤ";
  }
  if(miniWindow) {updateMiniwindowTitleBar(info)}
  // titleEl.textContent = `${name} | ${info}`;
};
document.getElementById('titleBar').onwheel = function(e) {
  e.preventDefault();
  titleBarScrollTimeouts.forEach(function(t){clearTimeout(t)});
  if(e.deltaY > 0) {document.getElementById('titleBar').scrollBy(11,0)}
  else if(e.deltaY < 0) {document.getElementById('titleBar').scrollBy(-11,0)};
  if(e.deltaX > 0) {document.getElementById('titleBar').scrollBy(11,0)}
  else if(e.deltaX < 0) {document.getElementById('titleBar').scrollBy(-11,0)}
};

function formatTime(sec) {
  if(globalSettings.secMinMode == 0) {
    if (isNaN(sec)) return "00:00";
    const minutes = Math.floor(sec / 60).toString().padStart(2, "0");
    const seconds = Math.floor(sec % 60).toString().padStart(2, "0");
    return `${minutes}:${seconds}`;
  } else if(globalSettings.secMinMode == 1) {
    if (isNaN(sec)) return "0000";
    return `${Math.floor(sec).toString().padStart(4, '0')}`.slice(-4);
  } else if(globalSettings.secMinMode == 2) {
    if (isNaN(sec)) return "0000";
    return `${Math.floor(sec/10).toString().padStart(4, '0')}`;
  }
}

// Update time counter display based on mode
function updateTimeCounter() {
  if (state > 0) {
    if (isMidi) {
      const cur = midiPlaying ? context.currentTime - midiStartTime : midiCurrentTime;
      current_time = cur;
      const dur = midiDuration;
      const rem = dur - cur;
      switch (globalSettings.timeDisplayMode) {
        case 0:
          renderTimer(`${(currentTrackIndex+1).toString().padStart(2, ' ').padEnd(3, ' ')} ${formatTime(cur)}`);
          break;
        case 1:
          renderTimer(`${(currentTrackIndex+1).toString().padStart(2, ' ').padEnd(3, ' ')}-${formatTime(rem)}`);
          break;
        case 2:
          renderTimer(`${(currentTrackIndex+1).toString().padStart(2, ' ').padEnd(3, ' ')} ${formatTime(dur)}`);
          break;
        case 3:
          renderTimer(`${(currentTrackIndex+1).toString().padStart(2, ' ').padEnd(3, ' ')} ${formatTime(isRecording ? (isRecPaused ? recTime : recTime + (performance.now()/1000 - recStartTime)) : recTime)}`);
          break;
      }
    } else {
      const cur = audio.currentTime;
      current_time = cur;
      const dur = audio.duration || 0;
      const rem = dur - cur;
      switch(globalSettings.timeDisplayMode) {
        case 0:
          renderTimer(`${(currentTrackIndex+1).toString().padStart(2, ' ').padEnd(3, ' ')} ${formatTime(cur)}`);
          break;
        case 1:
          renderTimer(`${(currentTrackIndex+1).toString().padStart(2, ' ').padEnd(3, ' ')}-${formatTime(rem)}`);
          break;
        case 2:
          renderTimer(`${(currentTrackIndex+1).toString().padStart(2, ' ').padEnd(3, ' ')} ${formatTime(dur)}`);
          break;
        case 3:
          renderTimer(`${(currentTrackIndex+1).toString().padStart(2, ' ').padEnd(3, ' ')} ${formatTime(isRecording ? (isRecPaused ? recTime : recTime + (performance.now()/1000 - recStartTime)) : recTime)}`);
          break;
      }
    }
  } else {
    renderTimer(`${tracks.length.toString().padStart(2, ' ').padEnd(3, ' ')} ${formatTime(tracksDur)}`);
    current_time = tracksDur;
  }
}

      }

          renderMiniwindowTimer(`${(currentTrackIndex+1).toString().padStart(2, ' ').padEnd(3, ' ')} ${formatTime(cur)}`);

function updateMiniwindowTitleBar(info) {

  miniWindowTitleBarScrollTimeouts.forEach(function(t){clearTimeout(t)});

      miniWindowTitleBarTimeout = setTimeout(function() {
        titleEl.innerHTML = `${renderTitleBar(name)}`;
      }, 3000+125*(info.length-26));//}, 1000));
    } else {
      miniWindowTitleBarTimeout = setTimeout(function() {
        titleEl.innerHTML = `${renderTitleBar(name)}`;
      }, 3000);

  <script type="module">
  /*
    Project Name : midi-parser-js
    Project Url  : https://github.com/colxi/midi-parser-js/
    Author       : colxi
    Author URL   : http://www.colxi.info/
    Description  : MidiParser library reads .MID binary files, Base64 encoded MIDI Data,
    or UInt8 Arrays, and outputs as a readable and structured JS object.
*/

(function(){
    'use strict';

    /**
     * CROSSBROWSER & NODEjs POLYFILL for ATOB() -
     * By: https://github.com/MaxArt2501 (modified)
     * @param  {string} string [description]
     * @return {[type]}        [description]
     */
    const _atob = function(string) {
        // base64 character set, plus padding character (=)
        let b64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=';
        // Regular expression to check formal correctness of base64 encoded strings
        let b64re = /^(?:[A-Za-z\d+\/]{4})*?(?:[A-Za-z\d+\/]{2}(?:==)?|[A-Za-z\d+\/]{3}=?)?$/;
        // remove data type signatures at the begining of the string
        // eg :  "data:audio/mid;base64,"
        string = string.replace( /^.*?base64,/ , '');
        // atob can work with strings with whitespaces, even inside the encoded part,
        // but only \t, \n, \f, \r and ' ', which can be stripped.
        string = String(string).replace(/[\t\n\f\r ]+/g, '');
        if (!b64re.test(string))
            throw new TypeError('Failed to execute _atob() : The string to be decoded is not correctly encoded.');

        // Adding the padding if missing, for semplicity
        string += '=='.slice(2 - (string.length & 3));
        let bitmap, result = '';
        let r1, r2, i = 0;
        for (; i < string.length;) {
            bitmap = b64.indexOf(string.charAt(i++)) << 18 | b64.indexOf(string.charAt(i++)) << 12
                    | (r1 = b64.indexOf(string.charAt(i++))) << 6 | (r2 = b64.indexOf(string.charAt(i++)));

            result += r1 === 64 ? String.fromCharCode(bitmap >> 16 & 255)
                    : r2 === 64 ? String.fromCharCode(bitmap >> 16 & 255, bitmap >> 8 & 255)
                    : String.fromCharCode(bitmap >> 16 & 255, bitmap >> 8 & 255, bitmap & 255);
        }
        return result;
    };


    /**
     * [MidiParser description]
     * @type {Object}
     */
    const MidiParser  = {
        // debug (bool), when enabled will log in console unimplemented events
        // warnings and internal handled errors.
        debug: false,

        /**
         * [parse description]
         * @param  {[type]} input     [description]
         * @param  {[type]} _callback [description]
         * @return {[type]}           [description]
         */
        parse: function(input, _callback){
            if(input instanceof Uint8Array) return MidiParser.Uint8(input);
            else if(typeof input === 'string') return MidiParser.Base64(input);
            else if(input instanceof HTMLElement && input.type === 'file') return MidiParser.addListener(input , _callback);
            else throw new Error('MidiParser.parse() : Invalid input provided');
        },

        /**
         * addListener() should be called in order attach a listener to the INPUT HTML element
         * that will provide the binary data automating the conversion, and returning
         * the structured data to the provided callback function.
         */
        addListener: function(_fileElement, _callback){
            if(!File || !FileReader) throw new Error('The File|FileReader APIs are not supported in this browser. Use instead MidiParser.Base64() or MidiParser.Uint8()');

            // validate provided element
            if( _fileElement === undefined ||
                !(_fileElement instanceof HTMLElement) ||
                _fileElement.tagName !== 'INPUT' ||
                _fileElement.type.toLowerCase() !== 'file' 
            ){
                console.warn('MidiParser.addListener() : Provided element is not a valid FILE INPUT element');
                return false;
            }
            _callback = _callback || function(){};

            _fileElement.addEventListener('change', function(InputEvt){             // set the 'file selected' event handler
                if (!InputEvt.target.files.length) return false;                    // return false if no elements where selected
                console.log('MidiParser.addListener() : File detected in INPUT ELEMENT processing data..');
                let reader = new FileReader();                                      // prepare the file Reader
                reader.readAsArrayBuffer(InputEvt.target.files[0]);                 // read the binary data
                reader.onload =  function(e){
                    _callback( MidiParser.Uint8(new Uint8Array(e.target.result)));  // encode data with Uint8Array and call the parser
                };
            });
        },

        /**
         * Base64() : convert baset4 string into uint8 array buffer, before performing the
         * parsing subroutine.
         */
        Base64 : function(b64String){
            b64String = String(b64String);

            let raw = _atob(b64String);
            let rawLength = raw.length;
            let t_array = new Uint8Array(new ArrayBuffer(rawLength));

            for(let i=0; i<rawLength; i++) t_array[i] = raw.charCodeAt(i);
            return  MidiParser.Uint8(t_array) ;
        },

        /**
         * parse() : function reads the binary data, interpreting and spliting each chuck
         * and parsing it to a structured Object. When job is finised returns the object
         * or 'false' if any error was generated.
         */
        Uint8: function(FileAsUint8Array){
            let file = {
                data: null,
                pointer: 0,
                movePointer: function(_bytes){                                      // move the pointer negative and positive direction
                    this.pointer += _bytes;
                    return this.pointer;
                },
                readInt: function(_bytes){                                          // get integer from next _bytes group (big-endian)
                    _bytes = Math.min(_bytes, this.data.byteLength-this.pointer);
                    if (_bytes < 1) return -1;                                                                      // EOF
                    let value = 0;
                    if(_bytes > 1){
                        for(let i=1; i<= (_bytes-1); i++){
                            value += this.data.getUint8(this.pointer) * Math.pow(256, (_bytes - i));
                            this.pointer++;
                        }
                    }
                    value += this.data.getUint8(this.pointer);
                    this.pointer++;
                    return value;
                },
                readStr: function(_bytes){                                          // read as ASCII chars, the followoing _bytes
                    let text = '';
                    for(let char=1; char <= _bytes; char++) text +=  String.fromCharCode(this.readInt(1));
                    return text;
                },
                readIntVLV: function(){                                             // read a variable length value
                    let value = 0;
                    if ( this.pointer >= this.data.byteLength ){
                        return -1;                                                  // EOF
                    }else if(this.data.getUint8(this.pointer) < 128){               // ...value in a single byte
                        value = this.readInt(1);
                    }else{                                                          // ...value in multiple bytes
                        let FirstBytes = [];
                        while(this.data.getUint8(this.pointer) >= 128){
                            FirstBytes.push(this.readInt(1) - 128);
                        }
                        let lastByte  = this.readInt(1);
                        for(let dt = 1; dt <= FirstBytes.length; dt++){
                            value += FirstBytes[FirstBytes.length - dt] * Math.pow(128, dt);
                        }
                        value += lastByte;
                    }
                    return value;
                }
            };

            file.data = new DataView(FileAsUint8Array.buffer, FileAsUint8Array.byteOffset, FileAsUint8Array.byteLength);                                            // 8 bits bytes file data array
            //  ** read FILE HEADER
            if(file.readInt(4) !== 0x4D546864){
                console.warn('Header validation failed (not MIDI standard or file corrupt.)');
                return false;                                                       // Header validation failed (not MIDI standard or file corrupt.)
            }
            let headerSize          = file.readInt(4);                              // header size (unused var), getted just for read pointer movement
            let MIDI                = {};                                           // create new midi object
            MIDI.formatType         = file.readInt(2);                              // get MIDI Format Type
            MIDI.tracks             = file.readInt(2);                              // get ammount of track chunks
            MIDI.track              = [];                                           // create array key for track data storing
            let timeDivisionByte1   = file.readInt(1);                              // get Time Division first byte
            let timeDivisionByte2   = file.readInt(1);                              // get Time Division second byte
            if(timeDivisionByte1 >= 128){                                           // discover Time Division mode (fps or tpf)
                MIDI.timeDivision    = [];
                MIDI.timeDivision[0] = timeDivisionByte1 - 128;                     // frames per second MODE  (1st byte)
                MIDI.timeDivision[1] = timeDivisionByte2;                           // ticks in each frame     (2nd byte)
            }else MIDI.timeDivision  = (timeDivisionByte1 * 256) + timeDivisionByte2;// else... ticks per beat MODE  (2 bytes value)

            //  ** read TRACK CHUNK
            for(let t=1; t <= MIDI.tracks; t++){
                MIDI.track[t-1]     = {event: []};                                  // create new Track entry in Array
                let headerValidation = file.readInt(4);
                if ( headerValidation === -1 ) break;                               // EOF
                if(headerValidation !== 0x4D54726B) return false;                   // Track chunk header validation failed.
                file.readInt(4);                                                    // move pointer. get chunk size (bytes length)
                let e               = 0;                                            // init event counter
                let endOfTrack      = false;                                        // FLAG for track reading secuence breaking
                // ** read EVENT CHUNK
                let statusByte;
                let laststatusByte;
                while(!endOfTrack){
                    e++;                                                            // increase by 1 event counter
                    MIDI.track[t-1].event[e-1] = {};                                // create new event object, in events array
                    MIDI.track[t-1].event[e-1].deltaTime  = file.readIntVLV();      // get DELTA TIME OF MIDI event (Variable Length Value)
                    statusByte = file.readInt(1);                                   // read EVENT TYPE (STATUS BYTE)
                    if(statusByte === -1) break;                                    // EOF
                    else if(statusByte >= 128) laststatusByte = statusByte;         // NEW STATUS BYTE DETECTED
                    else{                                                           // 'RUNNING STATUS' situation detected
                        statusByte = laststatusByte;                                // apply last loop, Status Byte
                        file.movePointer(-1);                                       // move back the pointer (cause readed byte is not status byte)
                    }


                    //
                    // ** IS META EVENT
                    //
                    if(statusByte === 0xFF){                                        // Meta Event type
                        MIDI.track[t-1].event[e-1].type = 0xFF;                     // assign metaEvent code to array
                        MIDI.track[t-1].event[e-1].metaType =  file.readInt(1);     // assign metaEvent subtype
                        let metaEventLength = file.readIntVLV();                    // get the metaEvent length
                        switch(MIDI.track[t-1].event[e-1].metaType){
                            case 0x2F:                                              // end of track, has no data byte
                            case -1:                                                // EOF
                                endOfTrack = true;                                  // change FLAG to force track reading loop breaking
                                break;
                            case 0x01:                                              // Text Event
                            case 0x02:                                              // Copyright Notice
                            case 0x03:
                            case 0x04:                                              // Instrument Name
                            case 0x05:                                              // Lyrics)
                            case 0x07:                                              // Cue point                                         // Sequence/Track Name (documentation: http://www.ta7.de/txt/musik/musi0006.htm)
                            case 0x06:                                              // Marker
                                MIDI.track[t-1].event[e-1].data = file.readStr(metaEventLength);
                                break;
                            case 0x21:                                              // MIDI PORT
                            case 0x59:                                              // Key Signature
                            case 0x51:                                              // Set Tempo
                                MIDI.track[t-1].event[e-1].data = file.readInt(metaEventLength);
                                break;
                            case 0x54:                                              // SMPTE Offset
                                MIDI.track[t-1].event[e-1].data    = [];
                                MIDI.track[t-1].event[e-1].data[0] = file.readInt(1);
                                MIDI.track[t-1].event[e-1].data[1] = file.readInt(1);
                                MIDI.track[t-1].event[e-1].data[2] = file.readInt(1);
                                MIDI.track[t-1].event[e-1].data[3] = file.readInt(1);
                                MIDI.track[t-1].event[e-1].data[4] = file.readInt(1);
                                break;
                            case 0x58:                                              // Time Signature
                                MIDI.track[t-1].event[e-1].data    = [];
                                MIDI.track[t-1].event[e-1].data[0] = file.readInt(1);
                                MIDI.track[t-1].event[e-1].data[1] = file.readInt(1);
                                MIDI.track[t-1].event[e-1].data[2] = file.readInt(1);
                                MIDI.track[t-1].event[e-1].data[3] = file.readInt(1);
                                break;
                            default :
                                // if user provided a custom interpreter, call it
                                // and assign to event the returned data
                                if( this.customInterpreter !== null){
                                    MIDI.track[t-1].event[e-1].data = this.customInterpreter( MIDI.track[t-1].event[e-1].metaType, file, metaEventLength);
                                }
                                // if no customInterpretr is provided, or returned
                                // false (=apply default), perform default action
                                if(this.customInterpreter === null || MIDI.track[t-1].event[e-1].data === false){
                                    file.readInt(metaEventLength);
                                    MIDI.track[t-1].event[e-1].data = file.readInt(metaEventLength);
                                    if (this.debug) console.info('Unimplemented 0xFF meta event! data block readed as Integer');
                                }
                        }
                    }

                    //
                    // IS REGULAR EVENT
                    //
                    else{                                                           // MIDI Control Events OR System Exclusive Events
                        statusByte = statusByte.toString(16).split('');             // split the status byte HEX representation, to obtain 4 bits values
                        if(!statusByte[1]) statusByte.unshift('0');                 // force 2 digits
                        MIDI.track[t-1].event[e-1].type = parseInt(statusByte[0], 16);// first byte is EVENT TYPE ID
                        MIDI.track[t-1].event[e-1].channel = parseInt(statusByte[1], 16);// second byte is channel
                        switch(MIDI.track[t-1].event[e-1].type){
                            case 0xF:{                                              // System Exclusive Events

                                // if user provided a custom interpreter, call it
                                // and assign to event the returned data
                                if( this.customInterpreter !== null){
                                    MIDI.track[t-1].event[e-1].data = this.customInterpreter( MIDI.track[t-1].event[e-1].type, file , false);
                                }

                                // if no customInterpretr is provided, or returned
                                // false (=apply default), perform default action
                                if(this.customInterpreter === null || MIDI.track[t-1].event[e-1].data === false){
                                    let event_length = file.readIntVLV();
                                    MIDI.track[t-1].event[e-1].data = file.readInt(event_length);
                                    if (this.debug) console.info('Unimplemented 0xF exclusive events! data block readed as Integer');
                                }
                                break;
                            }
                            case 0xA:                                               // Note Aftertouch
                            case 0xB:                                               // Controller
                            case 0xE:                                               // Pitch Bend Event
                            case 0x8:                                               // Note off
                            case 0x9:                                               // Note On
                                MIDI.track[t-1].event[e-1].data = [];
                                MIDI.track[t-1].event[e-1].data[0] = file.readInt(1);
                                MIDI.track[t-1].event[e-1].data[1] = file.readInt(1);
                                break;
                            case 0xC:                                               // Program Change
                            case 0xD:                                               // Channel Aftertouch
                                MIDI.track[t-1].event[e-1].data = file.readInt(1);
                                break;
                            case -1:                                                // EOF
                                endOfTrack = true;                                  // change FLAG to force track reading loop breaking
                                break;
                            default:
                                // if user provided a custom interpreter, call it
                                // and assign to event the returned data
                                if( this.customInterpreter !== null){
                                    MIDI.track[t-1].event[e-1].data = this.customInterpreter( MIDI.track[t-1].event[e-1].metaType, file , false);
                                }

                                // if no customInterpretr is provided, or returned
                                // false (=apply default), perform default action
                                if(this.customInterpreter === null || MIDI.track[t-1].event[e-1].data === false){
                                    console.log('Unknown EVENT detected... reading cancelled!');
                                    return false;
                                }
                        }
                    }
                }
            }
            return MIDI;
        },

        /**
         * custom function to handle unimplemented, or custom midi messages.
         * If message is a meta-event, the value of metaEventLength will be >0.
         * Function must return the value to store, and pointer of dataView needs
         * to be manually increased
         * If you want default action to be performed, return false
         */
        customInterpreter : null // function( e_type , arrayByffer, metaEventLength){ return e_data_int }
    };

                    typeof self === 'object' && self.self === self && self ||
                    typeof global === 'object' && global.global === global && global;

        _global.MidiParser = MidiParser;
